<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <!--Media Query-->
    <!--Media Features são escritas entre parentese-->
    <!--media="all": Serve para todos os Dispositivos-->
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <!--media="screen and (orientation: portrait)": Vai dar todas as configurações 
    para telas em Modo Retrato (Em pé)-->
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)">
    <!--media="screen and (orientation: landscape): Vai dar todas as configurações 
    para telas em Modo Paisagem (Deitado)-->
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
