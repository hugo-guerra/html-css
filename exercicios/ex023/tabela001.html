<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: brown;
        }

table{
    width: 400px;
    height: 400px;
    border-collapse: collapse;
}
tr.linha{
    background-color: greenyellow;
}
tr{
    background-color: white;
}
td{
    border: 1px solid black;
    padding: 8px;
    text-align: center; /*Alinhamento Horizontal*/
    vertical-align: bottom; /*Alinhamento Vertical no TD (TOP, MIDDLE, BOTTOM)*/
}       
td.dado{
    background-color: gray;
}
.numero{
    text-align: right;
}
    </style>
</head>
<body>
    <h1>MInha primeira tabela</h1>
    <!--
        HIERARQUIA DE TABELAS (Simples)
        TABLE = tabela
            TABLE ROW = linha de tabela
                TABLE HEADER = cabeçalho de tabela
                TABLE DATA = dado de tabela
    -->
    <table>
        <tr class="linha"> <!--Primeira Linha-->
            <td>A1</td> 
            <td>B1</td> <!--Células da Primeira Linha-->
            <td>C1</td>
        </tr>
        <tr> <!--Segunda Linha-->
            <td>A2</td>
            <td>B2</td> <!--Células da Segunda Linha-->
            <td class="numero">C2</td>
        </tr>
        <tr> <!--Terceira Linha-->
            <td>A3</td>
            <td class="dado">B3</td> <!--Células da Terceira Linha-->
            <td>C3</td>
        </tr>
        <tr> <!--Quarta Linha-->
            <td>A4</td>
            <td>B4</td> <!--Células da Quarta Linha-->
            <td class="numero">C4</td>
        </tr>
    </table>
</body>
</html>
