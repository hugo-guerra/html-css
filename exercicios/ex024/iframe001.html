<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
    <style>
iframe{
    width: 400px;
    height: 400px;
    overflow: auto;
    
}
/*overflow: auto; = scrolling="auto"*/
/*overflow: scroll; = scrolling="yes"*/
/*overflow: hidden; = scrolling="no"*/
/*
overflow-x: hidden; = horizontal 
overflow-y: scroll; = vertical 
*/
    </style>
</head>
<body>
    <h1>Testanto o uso de um iframe</h1>
    <p>Acessando o site do 
<iframe src="https://www.cursoemvideo.com" frameborder="1" height="500" width="500" scolling="auto">
        <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
</iframe> para aprender a programar.</p>
<!--scolling="auto": A barra de rolagem aparece somente se precisar.(Padrão)-->
<!--scolling="yes": A barra de rolagem aparece sempre.-->
<!--scolling="no": Impede a barra de rolagem.-->
    
    <p>O repositorio do Hugo 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
            <a href="https://gustavoguanabara.github.io" target="_blank">no GitHub</a>
        </iframe> tambem é muito legal</p>
</body>
</html>
