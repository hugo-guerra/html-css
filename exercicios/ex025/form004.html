<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <!--Estudar sobre Expressões Regulares/RegEx-->
        <fieldset>
        <!--A tag <fieldset> cria uma caixa ao redor de um conjunto de campos que possuem relação entre si.-->
            <legend>Dados Pessoais</legend>
            <!--A tag <legend> define um título para o grupo criado pelo <fieldset>. -->
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <!--E-mail-->
                <label for="iemail">E-mail: </label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
            </p>
            <p>
                <!--Telefone-->
                <!--PATTERN serve para definir um formato obrigatório que o valor digitado deve seguir.-->
                <!--^\(\d{2}\)\d{4,5}-\d{4}$ serve para colocar o padrão (xx) xxxxx-xxxx  -->
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required placeholder="ex.: (xx) xxxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
