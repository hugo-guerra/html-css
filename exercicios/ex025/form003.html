<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulario</h1>

    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required maxlength="30"
            placeholder="Nome Completo" autocomplete="name">
        </p>
        <!--O MINIMO e o MAXIMO para <input> numerico é MIN e MAX-->
        <!--STEP define de quanto em quanto o valor pode aumentar ou diminuir 
        quando o usuário usa as setas do campo numérico ou quando o navegador valida o valor digitado.-->
        <p>
            <label for="imedia">Media: </label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.5">
        </p>
        <!--VALUE coloca um valor pré definido no campo-->
        <p>
            <!--Mês e Ano -->
            <label for="imes">Período Letivo: </label>
            <input type="month" name="mes" id="imes" value="2026-06">
        </p>
        <p>
            <!--Dia/Mês/Ano -->
            <label for="idia">Dia da Prova: </label>
            <input type="date" name="dia" id="idia" value="2026-06-01">
        </p>
        <p>
            <!--Horário -->
            <label for="ihora">Hora da Prova: </label>
            <input type="time" name="hora" id="ihora">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
