<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: brown;
        }
    </style>
</head>
<body>
    <h1>teste de Formulário</h1>
<!--O atributo REQUIRED torna o campo obrigatório. -->

<!--O atributo MINLENGTH define a quantidade mínima de caracteres. -->
<!--O atributo MAXLENGTH define o limite máximo de caracteres.-->

<!--O atributo SIZE define a largura visual do campo.-->

<!--O atributo PLACEHOLDER mostra um texto de dica dentro do input.-->
<form action="cadastro.php" method="post" autocomplete="off">
    <p>
        <label for="iusu">Usuário: </label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="10" placeholder="Nome do usuário" autocomplete="username">
    </p>
    <p>
        <label for="isen">Senha: </label>
        <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" autocomplete="current-password">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</form>
<!--O atributo AUTOCOMPLETE controla o preenchimento automático do navegador.-->
<!--autocomplete="current-password": Indica que o campo é a senha atual do usuário.-->
<!--autocomplete="new-password": Indica que o usuário vai criar uma nova senha.-->

<!--A tag <input> com o TYPE RESET serve para limpar/redefinir 
os campos do formulário e voltar os valores para o estado inicial.-->
</body>
</html>
