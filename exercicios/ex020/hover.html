<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Houver</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        div > h2{
            display: none;
        }

        div:hover > h2{
            display: block;
            color: white;
            background-color: red;
        }

        div:hover{
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Exemplo de houver</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
        <h1>Pode passar o mause aqui</h1>
        <h2>TA AQUI A SURPRESA</h2>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
