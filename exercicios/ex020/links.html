<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a:active{
            color: yellow;
        }

        .especial{
            background-color: rgb(148, 59, 59);
        }

        .especial::before{
            content: ' 🔗';
        }

        .especial::after{
            content: ' 🔗';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/hugo-guerra" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@hugoguerra1071" target="_blank" class="especial">Canal do YouTube</a></li>
        <li><a href="https://www.linkedin.com/in/hugorguerra/" target="_blank" class="especial">Meu Linkedln</a></li>
    </ul>
</body>
</html>
